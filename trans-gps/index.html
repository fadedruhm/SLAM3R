<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Cesium 轨迹与GPS对齐误差分析</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html,
        body,
        #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #ui-hint {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: sans-serif;
            pointer-events: none;
            line-height: 1.5;
        }

        .color-box {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 5px;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div id="cesiumContainer"></div>
    <div id="ui-hint">
        <b>配准误差诊断面板</b><br>
        <span class="color-box" style="background: red;"></span>真实照片 GPS 位置<br>
        <span class="color-box" style="background: cyan;"></span>局部轨迹转换后位置<br>
        <span class="color-box" style="background: yellow;"></span>对齐误差连线<br>
    </div>

    <script>
        const viewer = new Cesium.Viewer('cesiumContainer', {
            animation: false, timeline: false, baseLayerPicker: false, geocoder: false,
            baseLayer: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({
                url: 'https://a.tile.openstreetmap.org/'
            }))
        });

        // 关闭地形深度检测，防止模型随视角漂移
        viewer.scene.globe.depthTestAgainstTerrain = false;

        // ==========================================
        // 1. 数据准备 (来自你的 Python 终端输出)
        // ==========================================
        const rawOrigin = { lon: 126.68094266666667, lat: 45.77315705555556, alt: 90.928 };

        const pythonMatrixArray = [
            107.29289801, -74.50445526, -1.21589655, 0.0,
            -29.86088928, -41.03790443, -120.36766972, 0.0,
            68.26946278, 99.14199296, -50.73759852, 0.0,
            -47.66239533, 14.12678485, 2.61631917, 1.0
        ];

        // 真实提取的 6 个 GPS 坐标 (过滤掉前三个异常点后)
        const gpsPoints = [
            { lon: 126.68094266666667, lat: 45.77315705555556, alt: 90.928 }, // 083
            { lon: 126.68142472222223, lat: 45.77312725, alt: 91.028 }, // 084
            { lon: 126.6818123888889, lat: 45.77315872222222, alt: 91.028 }, // 086
            { lon: 126.68221883333334, lat: 45.77325775, alt: 91.128 }, // 087
            { lon: 126.6825905, lat: 45.773400861111114, alt: 91.128 }, // 088
            { lon: 126.68285911111111, lat: 45.77358425, alt: 90.828 }  // 089
        ];

        // 真实提取的 6 个对应的局部轨迹坐标 (过滤掉前三个后)
        const localPoints = [
            new Cesium.Cartesian3(0.360411369, -0.036030132, 0.127822572),
            new Cesium.Cartesian3(0.609711005, -0.0871645199, 0.252519912),
            new Cesium.Cartesian3(0.797677177, -0.148378904, 0.365294144),
            new Cesium.Cartesian3(0.937234324, -0.230936156, 0.572122147),
            new Cesium.Cartesian3(1.043634090, -0.317695184, 0.792127399),
            new Cesium.Cartesian3(1.088044500, -0.410729998, 0.994049591)
        ];

        // ==========================================
        // 2. 矩阵计算 (只用纯算法结果，不加手动微调)
        // ==========================================
        const originCartesian = Cesium.Cartesian3.fromDegrees(rawOrigin.lon, rawOrigin.lat, rawOrigin.alt);
        const enuMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(originCartesian);
        const pythonMatrix = Cesium.Matrix4.fromArray(pythonMatrixArray);

        let algorithmModelMatrix = new Cesium.Matrix4();
        Cesium.Matrix4.multiply(enuMatrix, pythonMatrix, algorithmModelMatrix);

        // ==========================================
        // 3. 绘制分析点阵
        // ==========================================
        for (let i = 0; i < gpsPoints.length; i++) {
            // A. 绘制红色的真实 GPS 点
            let realGpsPos = Cesium.Cartesian3.fromDegrees(gpsPoints[i].lon, gpsPoints[i].lat, gpsPoints[i].alt);
            viewer.entities.add({
                position: realGpsPos,
                point: { pixelSize: 15, color: Cesium.Color.RED, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
                label: { text: 'GPS ' + i, font: '14pt monospace', pixelOffset: new Cesium.Cartesian2(0, -20) }
            });

            // B. 计算局部轨迹经过矩阵变换后的 ECEF 坐标
            let transformedLocalPos = new Cesium.Cartesian3();
            Cesium.Matrix4.multiplyByPoint(algorithmModelMatrix, localPoints[i], transformedLocalPos);

            // C. 绘制蓝色的转换后轨迹点
            viewer.entities.add({
                position: transformedLocalPos,
                point: { pixelSize: 15, color: Cesium.Color.CYAN, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
                label: { text: 'Trj ' + i, font: '14pt monospace', pixelOffset: new Cesium.Cartesian2(0, 20) }
            });

            // D. 画一条黄色的虚线，看看它们偏移了多少
            viewer.entities.add({
                polyline: {
                    positions: [realGpsPos, transformedLocalPos],
                    width: 3,
                    material: new Cesium.PolylineDashMaterialProperty({ color: Cesium.Color.YELLOW })
                }
            });
        }

        // ==========================================
        // 4. 加载模型 (方便查看建筑姿态)
        // ==========================================
        Cesium.Model.fromGltfAsync({
            url: './model.glb',
            modelMatrix: algorithmModelMatrix // 使用纯算法生成的矩阵，看看在没有微调下是什么样子
        }).then(function (model) {
            // 为了不让建筑遮挡点，可以将模型半透明，由于模型较复杂这里只飞向它
            viewer.scene.primitives.add(model);

            // 飞向这片区域
            viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(originCartesian, 300.0), {
                offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-45), 600)
            });
        });
    </script>
</body>

</html>
